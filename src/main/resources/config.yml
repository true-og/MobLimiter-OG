# Spawn-radius check in chunks. 2 = 5x5 = 25 chunks around a spawn event.
# Smaller radius lets multiple nearby farms coexist without starving each other.
radius: 2

# Breeding cooldown / baby growth accelerators. -1 disables override (vanilla timings).
# Vanilla: breeding cooldown 5 min (6000t), baby growth 20 min (24000t).
breeding_ticks: -1
growth_ticks: -1

logblock: false
relative_age: false
debug: false

# Tamed mobs (pets, horses, etc.) are exempt from limits. 200-player servers
# accumulate lots of pets; leaving this false prevents silent pet losses.
limit_tamed: false

# Elder guardians are rare/unique.
limit_elder_guardian: true

# Honor vanilla PersistenceRequired. Spawn-egg / /summon / picked-up-item mobs
# survive limits, matching vanilla "never despawn" semantics. Natural-spawn
# (farm spawners, mob spawning) is unaffected — those are not persistent.
respect_persistence: true

# Cull mobs carrying armor or hand items. Closes the abuse path where players
# drop gear to mobs (which sets PersistenceRequired in vanilla) to keep them
# loaded indefinitely. When true this overrides respect_persistence for armed
# mobs. Named / tamed / elder guardian exemptions still apply.
limit_armed: true

# Multiplier applied to a mob's configured age limit when it is holding or
# wearing an enchanted item. Lets admins give rarer geared mobs more airtime
# without disabling limits. 1.0 = no extra time, 2.0 = double. Mobs with
# age: -1 are unaffected.
enchanted_age_multiplier: 2.0

# In-game broadcast to moblimiter.notify holders. At 200 players + stacked farms
# this spams chat heavily. Leave off; /moblimiter stats is enough.
despawn_notify_players: false

despawn_notify_message: "&7[&cMobLimiter&f-&4OG&7] Despawned &e%mob%&7 (%reason%) at &f%world% %x%,%y%,%z%"


# Defaults tuned for farm-friendly + stacker-friendly operation.
# ChunkCap-OG enforces the hard per-chunk total entity ceiling; these caps are
# the per-type soft caps that only trip on excessive single-type density.
defaults:
  age: -1          # Passive/unspecified mobs do not age-despawn (vanilla)
  max: 800         # Same-type cap across the 5x5 spawn radius
  chunk_max: 200   # Same-type cap per chunk (stackers easily stay under)
  cull: 12         # Keep this many per type per chunk on chunk unload


# Per-mob overrides. age in ticks (20t = 1s, 24000t = 20min).
# cull = count retained per chunk on unload cull; -1 = never cull.
